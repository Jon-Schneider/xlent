# GoReleaser configuration for xlent (XL-11: cross-platform release binaries).
# Docs: https://goreleaser.com
version: 2

project_name: xlent

before:
  hooks:
    # Enforce the attribution invariants in the release path itself, so a local
    # `goreleaser release` (which bypasses `go test ./...`) still refuses to ship
    # a NOTICES file that is missing a dependency or has an unresolved license.
    - go test ./internal/ui -run "TestAttributionsMatchModuleGraph|TestValidateAttributionsResolves"
    # Regenerate the bundled third-party notices from the app's own attribution
    # data so every archive ships an up-to-date NOTICES file.
    - go run ./cmd/gen-notices THIRD_PARTY_NOTICES.txt

builds:
  - id: xlent
    main: ./cmd/xlent
    binary: xlent
    env:
      # Pure-Go build; disabling cgo keeps cross-compilation hermetic.
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # Inject the release version so `xlent --version` reports the tag including
      # its leading "v" (versionString then appends the VCS revision, e.g.
      # "xlent v1.2.3 (abc1234)").
      - -s -w -X main.version={{ .Tag }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: xlent
    ids:
      - xlent
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES.txt

notarize:
  macos:
    # Sign (Developer ID Application, hardened runtime) and notarize the macOS
    # binaries so a `brew install --cask` — which quarantines its artifacts —
    # passes Gatekeeper. Runs via quill (pure Go) on the Linux runner, so no
    # macOS runner is needed. Gated on the signing cert being present: releases
    # cut before the secrets exist ship unsigned rather than failing.
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - xlent
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: true
  prerelease: auto

homebrew_casks:
  # Publish a Homebrew cask to the tap repo on each release so macOS users can
  # `brew tap jon-schneider/xlent && brew install --cask xlent`. GoReleaser
  # writes Casks/xlent.rb (pointing at the notarized darwin archives + their
  # SHA-256s) and commits it to Jon-Schneider/homebrew-xlent.
  - name: xlent
    ids:
      - xlent
    repository:
      owner: Jon-Schneider
      name: homebrew-xlent
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/Jon-Schneider/xlent"
    description: "Terminal spreadsheet editor"
    # Only publish the cask for real (non-prerelease) tags.
    skip_upload: auto
